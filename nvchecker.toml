# Current versions are read from the specs by scripts/bump.py, oldver is
# only declared because nvchecker requires it to write newver.
[__config__]
oldver = ".nvchecker/oldver.json"
newver = ".nvchecker/newver.json"

[hyprwayland-scanner]
source = "github"
github = "hyprwm/hyprwayland-scanner"
use_max_tag = true
prefix = "v"

[hyprland-protocols]
source = "github"
github = "hyprwm/hyprland-protocols"
use_max_tag = true
prefix = "v"

[glaze-v7]
source = "github"
github = "stephenberry/glaze"
use_max_tag = true
include_regex = "v?7\\.[0-9.]+"
prefix = "v"

["lua5.5"]
source = "regex"
url = "https://www.lua.org/ftp/"
regex = "lua-(5\\.5\\.[0-9]+)\\.tar\\.gz"

